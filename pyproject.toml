[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersentinel-local-agent"
version = "0.2.0"
description = "Local-only NGINX JSONL telemetry adapter and durable continuous follower"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cybersentinel-agent = "cybersentinel_agent.cli:main"
cybersentinel-agent-watch = "cybersentinel_agent.watch_cli:main"

[tool.setuptools]
packages = ["cybersentinel_agent"]
