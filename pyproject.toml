[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersentinel-local-agent"
version = "0.1.0"
description = "Local-only NGINX JSONL telemetry adapter for CyberSentinel research"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cybersentinel-agent = "cybersentinel_agent.cli:main"

[tool.setuptools]
packages = ["cybersentinel_agent"]
