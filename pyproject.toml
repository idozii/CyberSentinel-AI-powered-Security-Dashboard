[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersentinel-local-agent"
version = "0.3.0"
description = "NGINX JSONL telemetry adapter with opt-in HTTPS staging ingest"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cybersentinel-agent = "cybersentinel_agent.cli:main"
cybersentinel-agent-watch = "cybersentinel_agent.watch_cli:main"
cybersentinel-demo-agent = "cybersentinel_agent.demo_cli:main"

[tool.setuptools]
packages = ["cybersentinel_agent"]
