name: CyberSentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Unit tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - name: Install ML dependencies
        run: python -m pip install -r requirements-ml.txt
      - name: Install local dashboard API test dependencies
        run: python -m pip install -r requirements-dashboard.txt
      - name: Install Step 10 owner auth dependencies
        run: python -m pip install -r requirements-owner.txt
      - name: Install Step 16 OIDC and Postgres dependencies
        run: python -m pip install -r requirements-hosted.txt
      - name: Install local telemetry agent package
        run: python -m pip install -e .
      - name: Compile Python
        run: python -m compileall -q scripts tests dashboard_api dashboard owner_api owner_portal cybersentinel_agent hosted_api
      - name: Run all unit tests (no remote traffic)
        run: python -m unittest discover -s tests -v
      - name: Step 8 source release audit
        run: python -m scripts.release_audit
      - name: Step 14 staging preflight
        run: python -m scripts.step14_preflight
      - name: Step 15 operator staging preflight
        run: python -m scripts.step15_preflight
      - name: Text style check (em/en dashes)
        run: python -m scripts.normalize_dashes --check
      - name: Step 16 hosted identity preflight
        run: python -m scripts.step16_preflight
      - name: Step 17 Auth0 browser pilot preflight
        run: python -m scripts.step17_preflight
      - name: Dependency consistency
        run: python -m pip check

  docker-local-smoke:
    name: Local NGINX / webapp smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Start isolated localhost lab
        run: docker compose -f simulations/docker-compose.yml up --build -d --wait
      - name: Check HTTP 200 and issued request ID
        run: |
          python - <<'PY'
          from urllib.request import build_opener, ProxyHandler
          opener = build_opener(ProxyHandler({}))
          with opener.open('http://127.0.0.1:8080/health', timeout=5) as r:
              assert r.status == 200
              assert r.headers.get('X-CyberSentinel-Request-ID')
          PY
      - name: End-to-end smoke test with 11 localhost requests
        run: |
          mkdir -p /tmp/cyber-step6
          python scripts/attack_replay.py --scenario mixed --attempts 3 --concurrency 2 \
            --manifest-path /tmp/cyber-step6/labels.jsonl > /tmp/cyber-step6/replay.json
          python scripts/collector.py \
            --input simulations/runtime/logs/access.log \
            --output-dir /tmp/cyber-step6/raw --target-service webapp
          python scripts/etl.py \
            --input-dir /tmp/cyber-step6/raw \
            --output /tmp/cyber-step6/events.csv --format csv
          python scripts/build_labeled_dataset.py \
            --events /tmp/cyber-step6/events.csv \
            --manifest /tmp/cyber-step6/labels.jsonl \
            --output /tmp/cyber-step6/labeled.csv --strict > /tmp/cyber-step6/join.json
          python scripts/build_window_features.py \
            --input /tmp/cyber-step6/labeled.csv \
            --output /tmp/cyber-step6/windows.csv --window-seconds 60 > /tmp/cyber-step6/windows.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/cyber-step6')
          replay=json.loads((root/'replay.json').read_text())
          join=json.loads((root/'join.json').read_text())
          windows=json.loads((root/'windows.json').read_text())
          assert replay['total_requests'] == 11
          assert replay['statuses'] == {'401': 3, '404': 8}, replay
          assert join['matched_labeled_events'] == 11, join
          assert join['manifest_records_without_event'] == 0, join
          assert windows['labeled_events'] == 11, windows
          assert windows['windows'] >= 1, windows
          PY
      - name: Diagnostic logs on failure
        if: failure()
        run: docker compose -f simulations/docker-compose.yml logs --tail=60 webapp proxy
      - name: Always remove local containers
        if: always()
        run: docker compose -f simulations/docker-compose.yml down --remove-orphans

  postgres-rls-staging:
    name: PostgreSQL RLS and OIDC foundation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cybersentinel_stage
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-ephemeral-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cybersentinel_stage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CYBERSENTINEL_TEST_PG_ADMIN_DSN: postgresql://postgres:ci-ephemeral-admin@127.0.0.1:5432/cybersentinel_stage
      CYBERSENTINEL_TEST_PG_RUNTIME_DSN: postgresql://cybersentinel_runtime:ci-ephemeral-runtime@127.0.0.1:5432/cybersentinel_stage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install hosted backend dependencies
        run: python -m pip install -r requirements-owner.txt -r requirements-hosted.txt -r requirements-dashboard.txt
      - name: Create least-privilege CI runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ['CYBERSENTINEL_TEST_PG_ADMIN_DSN']) as db:
              db.execute("CREATE ROLE cybersentinel_runtime LOGIN PASSWORD 'ci-ephemeral-runtime' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION")
              db.execute('GRANT CONNECT ON DATABASE cybersentinel_stage TO cybersentinel_runtime')
          PY
      - name: Real PostgreSQL RLS integration tests
        run: python -m unittest discover -s tests -p test_step16_postgres.py -v
      - name: Cryptographic OIDC and hosted API tests
        run: python -m unittest discover -s tests -p test_step16_hosted.py -v
