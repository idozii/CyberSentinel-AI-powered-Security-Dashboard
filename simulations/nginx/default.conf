log_format cyber_json escape=json
  '{'
    '"time_iso8601":"$time_iso8601",'
    '"service":"webapp",'
    '"container_id":"cs-webapp",'
    '"remote_addr":"$remote_addr",'
    '"xff":"$http_x_forwarded_for",'
    '"request_method":"$request_method",'
    '"host":"$host",'
    '"uri":"$uri",'
    '"args":"$args",'
    '"status":"$status",'
    '"request_length":"$request_length",'
    '"bytes_sent":"$bytes_sent",'
    '"request_time":"$request_time",'
    '"http_user_agent":"$http_user_agent",'
    '"http_referer":"$http_referer",'
    '"request_id":"$request_id"'
  '}';

server {
  listen 8080;
  server_name _;
  access_log /var/log/nginx/access.log cyber_json;
  # Correlates the proxy event with a separate, trusted simulation manifest.
  add_header X-CyberSentinel-Request-ID $request_id always;

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://webapp:8000;
  }
}
